<div class="space-y-3 pt-2">
    <!-- Category & Village Banner -->
    <div class="flex items-center justify-between gap-2">
        <span class="text-[14px] font-semibold px-3 py-1 rounded-full bg-[#FEF3C7] text-[#92400E] border border-[#F59E0B]/30">
            {{ details.category_display }}
        </span>
        <span class="text-[14px] text-[#6B7280] font-medium flex items-center gap-1">
            <span class="material-symbols-rounded text-[18px] text-[#16A34A]">location_on</span>
            {{ details.village }}
        </span>
    </div>

    <!-- Full Description -->
    {% if details.description %}
        <div class="text-[14px] text-[#111827] leading-relaxed bg-[#FEF3C7]/40 p-3.5 rounded-xl border border-[#F59E0B]/20 whitespace-pre-line">
            {{ details.description }}
        </div>
    {% endif %}

    <!-- Publish info -->
    {% if details.publish_date_str %}
        <div class="text-[14px] text-[#6B7280] flex items-center gap-1 pt-1">
            <span class="material-symbols-rounded text-[18px]">schedule</span>
            <span>Опубликовано: {{ details.publish_date_str }}</span>
        </div>
    {% endif %}
</div>
