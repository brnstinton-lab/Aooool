<div class="space-y-3 pt-2">
    <!-- Category -->
    <div class="flex items-center justify-between gap-2">
        <span class="text-[14px] font-semibold px-3 py-1 rounded-full bg-[#F3E8FF] text-[#9333EA] border border-[#9333EA]/30">
            {{ details.category_display }}
        </span>
    </div>

    <!-- Description -->
    {% if details.description %}
        <p class="text-[14px] text-[#111827] leading-relaxed bg-[#F8FAFC] p-3.5 rounded-xl border border-[#E5E7EB] whitespace-pre-line">
            {{ details.description }}
        </p>
    {% endif %}

    <!-- Phone Call Button -->
    {% if details.phone %}
        <div class="pt-1">
            <a href="tel:{{ details.phone }}" class="w-full bg-[#9333EA] hover:bg-[#7E22CE] active:scale-[0.98] text-white font-semibold text-[14px] py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-xs">
                <span class="material-symbols-rounded text-[20px]">call</span>
                <span>Позвонить ({{ details.phone }})</span>
            </a>
        </div>
    {% endif %}
</div>
