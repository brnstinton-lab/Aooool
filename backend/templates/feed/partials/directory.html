<div class="space-y-3 pt-1">
    <!-- Category -->
    <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-900 border border-purple-200">
            {{ details.category_display }}
        </span>
    </div>

    <!-- Description -->
    {% if details.description %}
        <p class="text-xs text-slate-700 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100 whitespace-pre-line">
            {{ details.description }}
        </p>
    {% endif %}

    <!-- Phone Call Button -->
    {% if details.phone %}
        <div class="pt-1">
            <a href="tel:{{ details.phone }}" class="w-full bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white font-bold text-xs py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-xs transition">
                <span class="material-symbols-outlined text-base">call</span>
                <span>Позвонить ({{ details.phone }})</span>
            </a>
        </div>
    {% endif %}
</div>
