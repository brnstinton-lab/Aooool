{% extends "base.html" %}

{% block title %}AUL — Редактирование профиля{% endblock %}

{% block content %}
<div class="space-y-4 pb-6">

    <!-- Заголовок и кнопка Назад -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <a href="{% url 'profile' %}" class="p-2 rounded-xl bg-white border border-slate-200/90 text-slate-600 hover:bg-slate-50 transition flex items-center justify-center" title="Назад">
                <span class="material-symbols-rounded text-xl">arrow_back</span>
            </a>
            <h1 class="text-lg font-bold text-slate-900">Редактирование профиля</h1>
        </div>
    </div>

    <!-- Основная форма редактирования -->
    <div class="bg-white rounded-[20px] p-5 sm:p-6 border border-slate-200/90 shadow-xs space-y-5">
        <form method="post" action="{% url 'profile_edit' %}" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Имя -->
                <div class="space-y-1.5">
                    <label for="first_name" class="block text-xs font-bold text-slate-700">Имя</label>
                    <div class="relative">
                        <input type="text" id="first_name" name="first_name" value="{{ user_first_name }}" required
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-xs font-medium focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 transition"
                               placeholder="Введите имя">
                    </div>
                </div>

                <!-- Фамилия -->
                <div class="space-y-1.5">
                    <label for="last_name" class="block text-xs font-bold text-slate-700">Фамилия</label>
                    <div class="relative">
                        <input type="text" id="last_name" name="last_name" value="{{ user_last_name }}"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-xs font-medium focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 transition"
                               placeholder="Введите фамилию">
                    </div>
                </div>
            </div>

            <!-- Телефон -->
            <div class="space-y-1.5">
                <label for="phone" class="block text-xs font-bold text-slate-700">Номер телефона</label>
                <div class="relative">
                    <input type="text" id="phone" name="phone" value="{{ user_phone }}" required
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-xs font-medium focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 transition"
                           placeholder="+7 (7XX) XXX-XX-XX">
                </div>
            </div>

            <!-- Email -->
            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-bold text-slate-700">Email (электронная почта)</label>
                <div class="relative">
                    <input type="email" id="email" name="email" value="{{ user_email }}"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-xs font-medium focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 transition"
                           placeholder="example@aul.kz">
                </div>
            </div>

            <!-- Аул -->
            <div class="space-y-1.5">
                <label for="village" class="block text-xs font-bold text-slate-700">Аул / Населённый пункт</label>
                <select id="village" name="village"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-xs font-medium focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 transition">
                    {% for v in village_options %}
                        <option value="{{ v }}" {% if v == user_village %}selected{% endif %}>{{ v }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Кнопки действий -->
            <div class="pt-3 flex flex-col-reverse sm:flex-row items-center justify-end gap-2.5 border-t border-slate-100">
                <a href="{% url 'profile' %}" 
                   class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold text-xs transition flex items-center justify-center">
                    Отмена
                </a>
                <button type="submit" 
                        class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-xs transition flex items-center justify-center gap-2 shadow-xs">
                    <span class="material-symbols-rounded text-base">check</span>
                    <span>Сохранить изменения</span>
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
