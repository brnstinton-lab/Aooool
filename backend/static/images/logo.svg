<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" fill="none">
  <!-- AUL Logo Symbol & Text according to DESIGN.md -->
  <!-- Brand Symbol Icon Badge -->
  <g transform="translate(10, 10)">
    <!-- Container Shield / Rounded Square -->
    <rect x="0" y="0" width="60" height="60" rx="18" fill="#16A34A" />
    
    <!-- Letter 'A' with Signal Waves & Person -->
    <path d="M18 44 L28 16 L32 16 L42 44 M22 34 L38 34" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Signal Waves above icon -->
    <path d="M25 12 C 28 9, 32 9, 35 12" stroke="#DCFCE7" stroke-width="2.5" stroke-linecap="round" />
    <path d="M22 8 C 27 4, 33 4, 38 8" stroke="#DCFCE7" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    
    <!-- House silhouette inside right leg -->
    <path d="M27 34 L30 30 L33 34 Z" fill="#DCFCE7" />
  </g>
  
  <!-- Text Brandmark "AUL" -->
  <text x="82" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" letter-spacing="1" fill="#1E293B">
    A<tspan fill="#16A34A">U</tspan>L
  </text>
  
  <!-- Slogan "СВОЙ ПОСЁЛОК. СВОИ ЛЮДИ." -->
  <text x="83" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="0.8" fill="#64748B">
    СВОЙ ПОСЁЛОК. СВОИ ЛЮДИ.
  </text>
</svg>
